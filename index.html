<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Alliance · Monthly Client Impact Report</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="controls no-print">
    <button id="btn-print" class="ctrl-btn" type="button">Print report</button>
    <button id="btn-pdf" class="ctrl-btn ctrl-btn--primary" type="button">Download as PDF</button>
  </div>

  <!-- SECTION 1 — HERO -->
  <section class="hero" id="hero">
    <div class="hero__inner">
      <p class="hero__brand reveal" style="--d:0">Doctor Alliance</p>
      <h1 class="hero__title">
        <span class="reveal" style="--d:1" id="hero-review"></span><br>
        <span class="reveal hero__client" style="--d:2" id="hero-client"></span>
      </h1>
      <p class="hero__statement reveal" style="--d:3" id="hero-statement"></p>
    </div>
  </section>

  <!-- SECTION 2 — MONTH AT A GLANCE -->
  <section class="glance fade-section" id="section-glance">
    <div class="wrap">
      <p class="eyebrow">Month at a glance</p>
      <div class="glance__grid" id="glance-grid"></div>
    </div>
  </section>

  <!-- SECTION 3 — BEHIND THE NUMBERS -->
  <section class="story fade-section" id="section-story">
    <div class="wrap story__layout">
      <div class="story__narrative">
        <p class="eyebrow">Behind the numbers</p>
        <p class="story__text" id="story-narrative"></p>
      </div>
      <div class="story__stats" id="story-stats"></div>
    </div>
  </section>

  <!-- SECTION 4 — WORKFLOW JOURNEY -->
  <section class="journey fade-section" id="section-journey">
    <div class="wrap">
      <p class="eyebrow">Workflow journey</p>
      <div class="journey__track" id="journey-track"></div>
    </div>
  </section>

  <!-- SECTION 5 — VALUE DELIVERED -->
  <section class="plate fade-section" id="section-plate">
    <div class="wrap">
      <p class="eyebrow eyebrow--light">What we took off your team's plate</p>
      <div class="plate__list" id="plate-list"></div>
    </div>
  </section>

  <!-- SECTION 6 — BUSINESS IMPACT (conditional) -->
  <section class="impact fade-section" id="section-impact" hidden>
    <div class="wrap impact__layout">
      <div class="impact__figure">
        <p class="eyebrow" id="impact-title">Business impact</p>
        <div class="impact__amount" id="impact-amount"></div>
        <div class="impact__sub" id="impact-sub"></div>
      </div>
      <div class="impact__table-wrap" id="impact-table-wrap"></div>
    </div>
  </section>

  <!-- SECTION 7 — MONTHLY HIGHLIGHTS -->
  <section class="highlights fade-section" id="section-highlights">
    <div class="wrap">
      <p class="eyebrow">Monthly highlights</p>
      <div class="highlights__grid" id="highlights-grid"></div>
    </div>
  </section>

  <!-- SECTION 8 — LOOKING AHEAD -->
  <section class="ahead fade-section" id="section-ahead">
    <div class="wrap">
      <p class="eyebrow eyebrow--light">Looking ahead</p>
      <ol class="ahead__list" id="ahead-list"></ol>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="report-footer">
    <p class="report-footer__brand">Doctor Alliance <span class="dot">·</span> Confidential</p>
    <p class="report-footer__note" id="footer-note"></p>
  </footer>

<script src="script.js"></script>
</body>
</html>
